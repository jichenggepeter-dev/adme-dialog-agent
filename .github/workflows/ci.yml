name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ADME_MOCK_MODE: "true"
      AGENT_ENABLED: "false"
      RUN_AGENT_LLM_INTEGRATION: "0"
      OPENAI_AGENTS_DISABLE_TRACING: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PYTHONDONTWRITEBYTECODE: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version-file: .python-version

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.32"

      - name: Install locked Python dependencies
        run: uv sync --locked --extra dev

      - name: Run documentation, backend, and Agent gates
        run: make verify-docs verify-backend
        env:
          AGENT_DB_PATH: ${{ runner.temp }}/adme-dialog-agent.sqlite3

  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: "true"
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run frontend gate
        run: make verify-frontend

  contributor-environment:
    name: Reproducible contributor environment
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Build and start the pinned Mock environment
        run: docker compose up --build --wait

      - name: Verify backend mode and frontend route
        run: |
          python -c "import json, urllib.request; status = json.load(urllib.request.urlopen('http://127.0.0.1:8000/status')); assert status['prediction_mode'] == 'mock'"
          curl --fail --silent --show-error http://127.0.0.1:3000/single >/dev/null

      - name: Stop the disposable environment
        if: always()
        run: docker compose down --volumes --remove-orphans

  review-app:
    name: Keyless Review App smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CI: "true"
      NEXT_TELEMETRY_DISABLED: "1"
      OPENAI_AGENTS_DISABLE_TRACING: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: requirements-preview.txt

      - name: Install review backend dependencies
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -r requirements-preview.txt

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install browser runtime
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Exercise real frontend-to-API Mock Agent flow
        working-directory: frontend
        run: npm run test:e2e -- review-app-mock.spec.ts --project=desktop

      - name: Run desktop and mobile accessibility checks
        working-directory: frontend
        run: npm run test:a11y
