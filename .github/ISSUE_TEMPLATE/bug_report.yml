name: Bug report
description: Report a reproducible problem without including private data.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting a problem. Use synthetic compounds and redact keys, local paths, conversations, uploads, and logs.
        Report security or cross-session data exposure privately using SECURITY.md.
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe the observed behavior and its impact.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: List the smallest sequence that reproduces the problem.
      placeholder: |
        1. Start with ADME_MOCK_MODE=true
        2. Open ...
        3. Enter a synthetic example ...
        4. Observe ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Product area
      options:
        - Single-compound workflow
        - Batch workflow
        - Model information
        - Assistant or Agent
        - Backend API
        - Installation or developer tooling
        - Documentation
        - Other
    validations:
      required: true
  - type: dropdown
    id: prediction_mode
    attributes:
      label: Prediction mode
      options:
        - Mock
        - Real ADMET-AI
        - Not applicable
        - Unknown
    validations:
      required: true
  - type: dropdown
    id: agent_mode
    attributes:
      label: Agent state
      options:
        - Disabled
        - Enabled with a configured provider
        - Not applicable
        - Unknown
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include OS, Python, Node.js, browser, and relevant package versions.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Redacted evidence
      description: Add a screenshot or short log excerpt only after removing private data and credentials.
  - type: checkboxes
    id: checks
    attributes:
      label: Privacy and scope checks
      options:
        - label: I used synthetic or public example data.
          required: true
        - label: I removed API keys, private molecular data, session identifiers, and personal paths.
          required: true
        - label: This report does not disclose a security vulnerability that should be private.
          required: true
